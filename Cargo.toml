[package]
name = "weavatrix-graph"
version = "0.6.3"
edition = "2024"
rust-version = "1.88"
description = "Deterministic, evidence-carrying graph core for Weavatrix repository intelligence"
license = "MIT"
authors = ["Sergii Ziborov <sergii.ziborov@gmail.com>"]
homepage = "https://weavatrix.com"
repository = "https://github.com/Weavatrix/weavatrix-graph"
documentation = "https://docs.rs/weavatrix-graph"
readme = "README.md"
keywords = ["graph", "code-graph", "static-analysis", "provenance", "architecture"]
categories = ["data-structures", "development-tools"]

[features]
default = ["std"]
std = ["serde/std"]
rayon = ["std", "dep:rayon"]
unsafe-fast = []

[dependencies]
rayon = { version = "1.11.0", optional = true }
serde = { version = "1.0.229", default-features = false, features = ["alloc", "derive"] }

[dev-dependencies]
biconnected-components = "0.5.0"
graaf = "0.112.0"
graph_builder = "0.4.2"
petgraph = { version = "0.8.3", default-features = false, features = ["std", "stable_graph", "rayon"] }
rustworkx-core = "0.18.0"
serde_json = "1.0.151"
weavatrix-scan = "0.3.0"

[target.'cfg(not(windows))'.dev-dependencies]
proptest = "1.9.0"

[[bench]]
name = "graph_builder"
harness = false

[[bench]]
name = "graph_serde"
harness = false

[[bench]]
name = "compare_competitors"
harness = false

[[bench]]
name = "topology_competitors"
harness = false

[[bench]]
name = "algorithm_competitors"
harness = false

[[bench]]
name = "component_competitors"
harness = false

[[bench]]
name = "advanced_algorithm_competitors"
path = "benches/advanced_algorithm_competitors/main.rs"
harness = false

[[bench]]
name = "p0_algorithm_competitors"
harness = false

[[bench]]
name = "p1_algorithm_competitors"
harness = false

[[bench]]
name = "p2_capabilities"
harness = false
required-features = ["rayon", "unsafe-fast"]

[[bench]]
name = "p0_strengthening_competitors"
harness = false

[[bench]]
name = "scale_graph_competitors"
path = "benches/scale_graph_competitors/main.rs"
harness = false

[[bench]]
name = "connectivity_link_analysis"
harness = false

[[bench]]
name = "distance_chain_analysis"
harness = false

[[bench]]
name = "edge_cut_analysis"
harness = false

[[bench]]
name = "keyed_stable_structures"
harness = false

[[bench]]
name = "parallel_scale_competitors"
harness = false
required-features = ["rayon"]

[[bench]]
name = "filesystem_graph_workload"
harness = false
required-features = ["rayon", "unsafe-fast"]

[[bench]]
name = "traversal_cache_competitors"
harness = false
required-features = ["rayon", "unsafe-fast"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
