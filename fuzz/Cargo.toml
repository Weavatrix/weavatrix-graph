[package]
name = "weavatrix-graph-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
weavatrix-graph = { path = "..", features = ["unsafe-fast"] }

[[bin]]
name = "topology"
path = "fuzz_targets/topology.rs"
test = false
doc = false
bench = false

[[bin]]
name = "formats"
path = "fuzz_targets/formats.rs"
test = false
doc = false
bench = false

[workspace]
members = ["."]
